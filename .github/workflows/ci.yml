name: Maven and Karate CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run the live Trendyol Selenium and Karate scenarios
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  api-tests:
    name: RestAssured API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api-tests/pom.xml
      - name: Run five local API contract tests
        run: mvn -B -ntp -f api-tests/pom.xml clean test
      - name: Explain API report scope
        if: always()
        run: |
          echo '## RestAssured API tests' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests use a loopback HTTP fixture, not the live Trendyol API.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check the Maven step result and download api-test-reports for Surefire XML and TestNG HTML.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          retention-days: 14
          if-no-files-found: warn
          path: api-tests/target/surefire-reports/

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            karate-ui/pom.xml
      - name: Unit tests
        run: mvn -B -ntp clean test
      - name: Cucumber step mapping (dry-run, no browser execution)
        run: >-
          mvn -B -ntp test -Dtest=EcommerceIT -Dcucumber.execution.dry-run=true
          '-Dcucumber.plugin=pretty,html:target/cucumber-step-mapping.html,json:target/cucumber-step-mapping.json'
      - name: Find Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_BINARY=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Karate browser smoke against local fixture
        run: >-
          mvn -B -ntp -f karate-ui/pom.xml test -Dtest=SetupRunner
          -Dheadless=true "-Dchrome.executable=$CHROME_BINARY"
      - name: Live Selenium scenarios (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_tests }}
        run: >-
          xvfb-run -a mvn -B -ntp test -Dtest=EcommerceIT
          '-Dcucumber.plugin=pretty,html:target/selenium-live.html,json:target/selenium-live.json'
      - name: Live Karate scenarios (optional)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.live_tests }}
        run: >-
          mvn -B -ntp -f karate-ui/pom.xml test -Dtest=TestRunner
          -Dheadless=true "-Dchrome.executable=$CHROME_BINARY"
      - name: Explain report scope
        if: always()
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          echo '## Test evidence' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download test-reports below for Surefire XML and Karate HTML/screenshots.' >> "$GITHUB_STEP_SUMMARY"
          echo 'cucumber-step-mapping.html is a dry-run report, not proof of live Trendyol behavior.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live tests run only when selected via workflow_dispatch. Check individual step conclusions.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo 'Pages publication is skipped for private repositories; test-reports remains available as a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare public report site
        if: ${{ success() && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.live_tests }}
        shell: pwsh
        run: ./scripts/build-report-site.ps1
      - name: Upload Pages content
        if: ${{ success() && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.live_tests }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/report-site
      - name: Upload reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/cucumber-step-mapping.*
            target/selenium-live.*
            karate-ui/target/surefire-reports/
            karate-ui/target/karate-reports/

  publish-reports:
    needs: [verify, api-tests]
    if: ${{ success() && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.live_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: report-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages-status.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_URL/repos/$REPOSITORY/pages")
          case "$status" in
            200)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::notice::Pages site is unavailable. Enable Settings > Pages > Source > GitHub Actions to publish reports.'
              echo 'Pages deployment skipped: site unavailable (HTTP 404). Test reports remain available as workflow artifacts. Enable Settings > Pages > Source > GitHub Actions, then rerun this job.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Pages availability check failed with HTTP $status."
              exit 1
              ;;
          esac
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Publish HTML reports
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
